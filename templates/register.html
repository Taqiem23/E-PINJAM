{% extends 'base.html' %}{% block title %}Student Registration · E-PINJAM{% endblock %}{% block content %}<div class="auth-wrap wide"><div class="auth-card"><p class="eyebrow">STUDENT</p><h1>Create account</h1><p class="muted">Enter your student details to register.</p><form method="post" class="form"><div class="form-grid"><label>Full name<input name="name" value="{{ request.form.get('name','') }}" required></label><label>Email<input type="email" name="email" value="{{ request.form.get('email','') }}" required></label><label>Matric number<input name="matric_no" value="{{ request.form.get('matric_no','') }}" required></label><label>Class<input name="class_name" value="{{ request.form.get('class_name','') }}" required></label></div><label>Password<input type="password" name="password" minlength="8" required><small>Minimum 8 characters with uppercase, lowercase and a number.</small></label><label>Confirm password<input type="password" name="confirm_password" required></label><button class="primary-btn full">Register</button></form><p class="center muted">Already have an account? <a href="{{ url_for('login') }}">Login</a></p></div></div>{% endblock %}
